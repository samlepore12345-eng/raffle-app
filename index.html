<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Raffle App</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #f0f0f0; padding: 20px; }
        .container { max-width: 1000px; margin: 0 auto; background: white; padding: 30px; border-radius: 10px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        h1 { text-align: center; margin-bottom: 30px; color: #333; }
        .status { text-align: center; margin-bottom: 20px; padding: 10px; background: #e8f5e9; border-radius: 5px; }
        .numbers-grid { display: grid; grid-template-columns: repeat(10, 1fr); gap: 10px; margin-bottom: 30px; }
        .number-btn { padding: 20px; background: #ddd; border: 2px solid #999; border-radius: 5px; cursor: pointer; font-size: 16px; font-weight: bold; }
        .number-btn.selected { background: #4CAF50; color: white; }
        .controls { text-align: center; }
        .btn { padding: 12px 30px; margin: 10px; font-size: 16px; border: none; border-radius: 5px; cursor: pointer; }
        .btn-primary { background: #2196F3; color: white; }
        .btn-danger { background: #f44336; color: white; }
        .info { text-align: center; margin-top: 20px; padding: 10px; background: #fff3cd; border-radius: 5px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎰 Raffle App</h1>
        <div class="status" id="status">Conectando...</div>
        <div class="numbers-grid" id="numbersGrid"></div>
        <div class="controls">
            <button class="btn btn-primary" id="submitBtn">Enviar</button>
            <button class="btn btn-danger" id="resetBtn">Limpiar</button>
        </div>
        <div class="info" id="info">Selecciona un número 00-99</div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        let selectedNumber = null;
        const supabase = window.supabase.createClient(
            'https://drexibmkpnbpnooqmmjl.supabase.co',
            'sb_publishable_NjBsRkQgR3sXuuKCfpyi9g_tMH1bbe6'
        );
        document.getElementById('status').innerText = '✅ Listo';

        const grid = document.getElementById('numbersGrid');
        for(let i = 0; i < 100; i++) {
            const btn = document.createElement('button');
            btn.className = 'number-btn';
            btn.textContent = String(i).padStart(2, '0');
            btn.onclick = () => {
                document.querySelectorAll('.number-btn').forEach(b => b.classList.remove('selected'));
                btn.classList.add('selected');
                selectedNumber = i;
                document.getElementById('info').innerText = 'Número: ' + String(i).padStart(2, '0');
            };
            grid.appendChild(btn);
        }

        document.getElementById('submitBtn').onclick = () => alert(selectedNumber !== null ? 'Número ' + String(selectedNumber).padStart(2, '0') : 'Selecciona un número');
        document.getElementById('resetBtn').onclick = () => {
            selectedNumber = null;
            document.querySelectorAll('.number-btn').forEach(b => b.classList.remove('selected'));
            document.getElementById('info').innerText = 'Selecciona un número 00-99';
        };
    </script>
</body>
</html>
